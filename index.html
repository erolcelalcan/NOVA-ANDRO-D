<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI</title>
<style>
:root {
  --bg: #212121;
  --panel: #171717;
  --text: #f5f5f5;
  --muted: #aaa;
  --input: #303030;
}
body.light {
  --bg: #f7f7f7;
  --panel: #fff;
  --text: #202020;
  --muted: #666;
  --input: #eee;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
header {
  height: 58px;
  display: flex;
  align-items: center;
  padding: 0 15px;
  gap: 15px;
  border-bottom: 1px solid #5553;
}
button {
  background: transparent;
  border: 0;
  color: var(--text);
  font-size: 17px;
  padding: 9px;
  cursor: pointer;
}
.brand { font-size: 20px; font-weight: bold; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px 14px;
}
.welcome {
  text-align: center;
  margin: 20vh auto 0;
}
.welcome h1 { font-size: 30px; }
.msg {
  padding: 13px 15px;
  border-radius: 17px;
  margin: 12px 0;
  max-width: 88%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.user { background: var(--input); margin-left: auto; }
.nova { background: var(--panel); margin-right: auto; }
footer { padding: 10px 12px 18px; }
.composer {
  display: flex;
  align-items: end;
  background: var(--input);
  border-radius: 25px;
  padding: 5px 9px;
  max-width: 700px;
  margin: auto;
}
textarea {
  flex: 1;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  padding: 12px 5px;
  font-size: 16px;
  max-height: 120px;
}
#send {
  background: var(--text);
  color: var(--bg);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-weight: bold;
}
#drawer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 5;
  background: #0008;
}
#side {
  background: var(--panel);
  width: min(290px, 82vw);
  height: 100%;
  padding: 18px;
}
.sidebtn {
  display: block;
  width: 100%;
  text-align: left;
  margin: 8px 0;
  border-radius: 10px;
  background: var(--input);
}
#status { color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Menüyü aç">☰</button>
  <div class="brand">NOVA</div>
  <div style="flex:1"></div>
  <button id="newChat">＋</button>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <h1>NOVA'ya hoş geldin</h1>
    <p>Bugün sana nasıl yardımcı olabilirim?</p>
  </div>
</div>

<footer>
  <div class="composer">
    <textarea id="prompt" rows="1" placeholder="NOVA'ya mesaj yaz..."></textarea>
    <button id="send" aria-label="Gönder">↑</button>
  </div>
  <p id="status">NOVA arayüzü · Yapay zekâ bağlantısı henüz kurulmadı</p>
</footer>

<div id="drawer">
  <div id="side">
    <button id="close">← Kapat</button>
    <h2>NOVA</h2>
    <button class="sidebtn" id="sideNew">＋ Yeni sohbet</button>
    <button class="sidebtn" id="settings">⚙️ Ayarlar</button>
    <h3>Geçmiş</h3>
    <div id="history"></div>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const promptBox = document.getElementById('prompt');
const drawer = document.getElementById('drawer');
let chats = [];
let current = [];
let chatNumber = 0;

function render() {
  messages.innerHTML = '';
  if (!current.length) {
    messages.innerHTML =
      '<div class="welcome"><h1>NOVA\\'ya hoş geldin</h1><p>Bugün sana nasıl yardımcı olabilirim?</p></div>';
    return;
  }
  current.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + m.role;
    div.textContent = m.text;
    messages.appendChild(div);
  });
  messages.scrollTop = messages.scrollHeight;
}

function saveChat() {
  if (!current.length) return;
  const first = current.find(m => m.role === 'user');
  const title = first ? first.text.slice(0, 28) : 'Yeni sohbet';
  const id = chatNumber++;
  chats.unshift({ id, title, messages: current.map(m => ({...m})) });
  renderHistory();
}

function renderHistory() {
  const history = document.getElementById('history');
  history.innerHTML = '';
  chats.forEach(chat => {
    const b = document.createElement('button');
    b.className = 'sidebtn';
    b.textContent = chat.title;
    b.onclick = () => {
      current = chat.messages.map(m => ({...m}));
      render();
      drawer.style.display = 'none';
    };
    history.appendChild(b);
  });
}

function newChat() {
  saveChat();
  current = [];
  render();
  drawer.style.display = 'none';
}

function sendMessage() {
  const text = promptBox.value.trim();
  if (!text) return;
  current.push({role: 'user', text});
  current.push({
    role: 'nova',
    text: 'NOVA arayüzü hazır. Yapay zekâ motoru henüz bağlanmadı.'
  });
  promptBox.value = '';
  render();
}

document.getElementById('send').onclick = sendMessage;
promptBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById('menu').onclick = () => drawer.style.display = 'block';
document.getElementById('close').onclick = () => drawer.style.display = 'none';
document.getElementById('newChat').onclick = newChat;
document.getElementById('sideNew').onclick = newChat;

document.getElementById('settings').onclick = () => {
  const light = document.body.classList.contains('light');
  if (light) {
    document.body.classList.remove('light');
    alert('Koyu tema etkin.');
  } else {
    document.body.classList.add('light');
    alert('Açık tema etkin.');
  }
};
drawer.onclick = e => {
  if (e.target === drawer) drawer.style.display = 'none';
};
</script>
</body>
</html>
